services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      API_KEY: ${API_KEY:?définir API_KEY dans .env}
      OLLAMA_URL: http://host.docker.internal:11434
      MODELE: llama3.2
    depends_on: [db]
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
